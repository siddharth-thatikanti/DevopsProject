services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      backend:
        condition: service_started


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "admin@123"
      POSTGRES_DB: app

    depends_on:
      database:
        condition: service_healthy


  database:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "admin@123"
      POSTGRES_DB: app

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin -d app

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


volumes:
  postgres_data: