services:

  frontend:
    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

      - frontend_node_modules:/app/node_modules

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0


  backend:
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command:
      - fastapi
      - dev
      - main.py

      - --host
      - 0.0.0.0


  database:
    ports:
      - "5432:5432"


volumes:

  frontend_node_modules: